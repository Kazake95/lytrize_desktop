[theme]
primaryColor = "#4f6ef7"
backgroundColor = "#0a0f1e"
secondaryBackgroundColor = "#14203d"
textColor = "#f1f5f9"
font = "sans serif"

[server]
maxUploadSize = 500
enableCORS = false
enableXsrfProtection = false
runOnSave = false
port = 8501
address = "127.0.0.1"

[browser]
# Never phone home — fully offline-capable desktop install
gatherUsageStats = false
serverAddress = "127.0.0.1"
serverPort = 8501

[runner]
fastReruns = true
magicEnabled = false

[client]
toolbarMode = "minimal"
# Prevent Streamlit from loading external resources in the frontend
showErrorDetails = false
