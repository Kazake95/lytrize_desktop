<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 16px; font-weight: 600; color: #f8fafc; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      color: white; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 12px;
      line-height: 1.5; display: none;
    }
    .status.show { display: block; }
    .status.success { background: rgba(20, 184, 166, 0.15); color: #14b8a6; }
    .status.error { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .status.info { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .hint { margin-top: 16px; font-size: 11px; color: #64748b; line-height: 1.5; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
    }
    .btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="Lytrize-Clip" style="width:32px;height:32px;">
    <h1>Lytrize-Clip</h1>
  </div>
  <button class="btn" id="captureBtn">
    <span class="spinner"></span>
    <span class="btn-text">Capture Full Page</span>
  </button>
  <div class="status" id="status"></div>
  <div class="hint">
    Captures the entire page exactly as rendered — including expanded dropdowns, modals, and dynamic content. No scrolling or stitching.
  </div>
  <script src="popup.js"></script>
</body>
</html>
